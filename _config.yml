# Intentionally disabled until the owner provides real analytics settings.
google_analytics_id:
google_site_verification:
bing_site_verification:
baidu_site_verification:
visitor_trace:
  base_url:
  site_id:

author:
  name: "Fangzhou Zhang"
  name_zh: "张方舟"
  citation_name:
    given: "Fangzhou"
    family: "Zhang"
  initials: "FZ"
  bio: "Incoming Graduate Student at USTC · Network Engineering at DMU"
  bio_zh: "中国科学技术大学准研究生 · 大连海事大学网络工程"
  location: "China"
  location_zh: "中国"
  email:
  github:
  googlescholar:
  linkedin:
  dblp:
  orcid:
  blog:

include:
  - .htaccess
  - _pages
  - files
exclude:
  - docs
  - scripts
  - "*.sublime-project"
  - "*.sublime-workspace"
  - .asset-cache
  - .bundle
  - .jekyll-assets-cache
  - .sass-cache
  - .github
  - CHANGELOG
  - Capfile
  - Gemfile
  - Gruntfile.js
  - LICENSE
  - README.md
  - Rakefile
  - assets/js/_main.js
  - assets/js/plugins
  - assets/js/vendor
  - config
  - gulpfile.js
  - log
  - assets/pubs
  - images/institutions
  - images/profile
  - images/publications
  - images/site
  - node_modules
  - package.json
  - tmp
  - vendor
keep_files:
  - .git
encoding: "utf-8"
markdown_ext: "markdown,mkdown,mkdn,mkd,md"

markdown: kramdown
highlighter: rouge
lsi: false
excerpt_separator: "\n\n"
incremental: false
kramdown:
  input: GFM
  hard_wrap: false
  auto_ids: true
  footnote_nr: 1
  entity_output: as_char
  toc_levels: 1..6
  smart_quotes: lsquo,rsquo,ldquo,rdquo
  enable_coderay: false

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: default
      author_profile: true

sass:
  sass_dir: _sass
  style: compressed

permalink: /:categories/:title/
timezone: Asia/Shanghai

plugins:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jekyll-redirect-from
whitelist:
  - jekyll-paginate
  - jekyll-sitemap
  - jekyll-gist
  - jekyll-feed
  - jemoji
